<html>

</head>
<body class="py-10">
    <div class="m-auto">
        <h1 class="text-[#1877F2] text-center font-bold font-sans text-[48px] mb-20">Talknote</h1>

        <div class="px-30">
             <label for="mobile-number-email" class="text-[20px]">Mobile number or email</label>
             <input type="text" id="mobile-number-email" 
             class="border-2 border-[#1877F2] 
             rounded-[10px] w-full 
             h-10 p-3 mb-5">

             <label for="password" class="text-[20px]">Password</label>
             <input type="password" id="password" 
             class="border-2 border-[#1877F2] 
             rounded-[10px] w-full 
             h-10 p-3 mb-6">

             
             <button class="inline-block bg-[#1877F2] text-white py-2 px-7 rounded-[5px] transition-all duration-500 hover:py-3 hover:px-8 active:bg-[rgb(0,68,107)]"> Log in </button>
             <a href="#" class="float-right mt-2">Forgot password?</a>
      
             <button class="block m-auto border border-[#1877F2] rounded-2xl py-1 px-3 w-full mt-20">Create new account</button>
        </div>

        
       

    </div>
</body>
</html>
