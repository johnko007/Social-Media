<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body class="py-10">
    <div class="m-auto">
        <h1 class="text-[#1877F2] text-center font-bold font-sans text-[48px] mb-20">Talknote</h1>

        <div class="px-7 m-auto w-100">
             <label for="mobile-number-email" class="text-[20px]">Mobile number or email</label>
             <input type="text" id="mobile-number-email" 
             class="border-2 border-[#1877F2] 
             rounded-[10px] w-full
             h-10 p-3 mb-5">

             <label for="password" class="text-[20px]">Password</label>
             <input type="password" id="password" 
             class="border-2 border-[#1877F2] 
             rounded-[10px] w-full 
             h-10 p-3 mb-6">

             <button class="inline-block bg-[#1877F2] text-white py-3 px-7 rounded-[5px] hover:bg-[rgb(5,100,193)] active:bg-[#1877F2] cursor-pointer"> Log in </button>
             <a href="#" class="float-right mt-3">Forgot password?</a>
        
             <button class="block m-auto bg-[#1877F2] rounded-2xl text-white py-3 px-3 w-full mt-20 hover:bg-[rgb(5,100,193)] active:bg-[#1877F2] cursor-pointer">Create new account</button>
        </div>
    </div>

</body>
</html>
