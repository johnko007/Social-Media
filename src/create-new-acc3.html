<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/output.css">
    <link rel="icon" type="image/x-icon" href="img/talknote.jpg">
    <title>Talknote</title>
    <style>
        select, ::picker(select) {
            appearance: base-select;
        }

        select{
            border: 1px solid #750cff;
            border-radius: 50px;
            width: 100%;
            padding: 13px 10px;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 20px;
        }

        ::picker(select){
            background: #750cff;
            color: white;
            padding: 5px;
            border-radius: 4px;
            border: none;
        }

        select option:hover{
            background:rgba(20,20,20,0.5);
            border-radius: 5px;
        }
    </style>
</head>
<body class="bg-black">
    <div class="m-auto w-100 px-7 py-25">
        <a href="create-new-acc2.html">
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-9 h-9 text-[#750cff] mb-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
        </a>

        <h3 class="text-[20px] font-medium text-white mb-5">Choose Gender</h3>
        <select>
            <option>Male</option>
            <option>Female</option>
        </select>
        
        <button class="bg-[#750cff] py-3 px-3 w-full rounded-2xl text-white hover:bg-[#862ef8] active:bg-[#750cff] cursor-pointer" onclick="document.location='create-new-acc4.html'"> Continue</button>
    </div>
</body>
</html>
