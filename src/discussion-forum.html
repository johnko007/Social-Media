<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/output.css">
    <link rel="icon" type="image/x-icon" href="img/talknote.jpg">
    <title>Talknote</title>
</head>
<body class="bg-black p-0 m-0">
    <nav class="bg-[rgb(8,8,8)] h-16 flex items-center sticky z-1000 px-5 w-full">
        <button><img src="img/menu.png" alt="menu icon" class="w-10 mr-2 cursor-pointer hover:bg-[#222] active:bg-[#111] rounded-4xl" onclick="sidebar()"></button>
        <h3 class="text-[#750cff] text-2xl font-extrabold font-sans cursor-pointer mr-5" onclick="document.location='news-feed.html'">Talknote</h3>

        <div class="hidden sm:flex m-auto h-9 w-60">
            <input type="search" class="border border-[#750cff] rounded-tl-2xl rounded-bl-2xl px-2 text-white">
            <svg class="w-10 h-9 text-[#750cff] cursor-pointer mr-auto border rounded-tr-2xl rounded-br-2xl" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
            </svg>
        </div>
        
        <svg class="block sm:hidden w-10 h-9 text-white cursor-pointer ml-auto hover:bg-[#222] active:bg-[#111] rounded-4xl p-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
        </svg>
        
        <svg class="w-10 h-9 text-white  cursor-pointer ml-5 hover:bg-[#222] active:bg-[#111] rounded-4xl p-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" onclick="document.location='notification.html'">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5.365V3m0 2.365a5.338 5.338 0 0 1 5.133 5.368v1.8c0 2.386 1.867 2.982 1.867 4.175 0 .593 0 1.292-.538 1.292H5.538C5 18 5 17.301 5 16.708c0-1.193 1.867-1.789 1.867-4.175v-1.8A5.338 5.338 0 0 1 12 5.365ZM8.733 18c.094.852.306 1.54.944 2.112a3.48 3.48 0 0 0 4.646 0c.638-.572 1.236-1.26 1.33-2.112h-6.92Z"/>
        </svg>

        <svg class="w-10 h-9 text-white cursor-pointer ml-5 hover:bg-[#222] active:bg-[#111] rounded-4xl p-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" onclick="document.location='discussion-forum.html'">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M4.5 17H4a1 1 0 0 1-1-1 3 3 0 0 1 3-3h1m0-3.05A2.5 2.5 0 1 1 9 5.5M19.5 17h.5a1 1 0 0 0 1-1 3 3 0 0 0-3-3h-1m0-3.05a2.5 2.5 0 1 0-2-4.45m.5 13.5h-7a1 1 0 0 1-1-1 3 3 0 0 1 3-3h3a3 3 0 0 1 3 3 1 1 0 0 1-1 1Zm-1-9.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"/>
        </svg>


    </nav>

    <aside id="sidebar" class="bg-[#111] text-white fixed top-0 -left-full bottom-0 w-50 z-1200 px-2 transition-all duration-500">
        <div class="flex items-center mt-2">
            <button><img src="img/menu.png" alt="menu icon" class="w-10 mr-2 cursor-pointer hover:bg-[#222] active:bg-[#111] rounded-4xl" onclick="sidebar()"></button>
            <h3 class="text-[#750cff] text-2xl font-extrabold font-sans cursor-pointer" onclick="document.location='news-feed.html'">Talknote</h3>
        </div>

        <button class="flex items-center bg-[#222] p-2 w-full rounded-3xl mt-8 hover:bg-[rgb(30,30,30)] active:bg-[#222]" onclick="document.location='news-feed.html'"> 
            <svg class="m-auto mr-0 w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M11.293 3.293a1 1 0 0 1 1.414 0l6 6 2 2a1 1 0 0 1-1.414 1.414L19 12.414V19a2 2 0 0 1-2 2h-3a1 1 0 0 1-1-1v-3h-2v3a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2v-6.586l-.293.293a1 1 0 0 1-1.414-1.414l2-2 6-6Z" clip-rule="evenodd"/>
            </svg>
            <p class="m-auto ml-0">Home</p>
        </button>

        <button class="flex items-center bg-[#222] p-2 w-full rounded-3xl mt-5 hover:bg-[rgb(30,30,30)] active:bg-[#222]" onclick="document.location='new-post.html'"> 
           <svg class="m-auto mr-0 w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M11.32 6.176H5c-1.105 0-2 .949-2 2.118v10.588C3 20.052 3.895 21 5 21h11c1.105 0 2-.948 2-2.118v-7.75l-3.914 4.144A2.46 2.46 0 0 1 12.81 16l-2.681.568c-1.75.37-3.292-1.263-2.942-3.115l.536-2.839c.097-.512.335-.983.684-1.352l2.914-3.086Z" clip-rule="evenodd"/>
                <path fill-rule="evenodd" d="M19.846 4.318a2.148 2.148 0 0 0-.437-.692 2.014 2.014 0 0 0-.654-.463 1.92 1.92 0 0 0-1.544 0 2.014 2.014 0 0 0-.654.463l-.546.578 2.852 3.02.546-.579a2.14 2.14 0 0 0 .437-.692 2.244 2.244 0 0 0 0-1.635ZM17.45 8.721 14.597 5.7 9.82 10.76a.54.54 0 0 0-.137.27l-.536 2.84c-.07.37.239.696.588.622l2.682-.567a.492.492 0 0 0 .255-.145l4.778-5.06Z" clip-rule="evenodd"/>
            </svg>
            <p class="m-auto ml-0">Post</p>
        </button>

        <button class="flex items-center bg-[#222] p-2 w-full rounded-3xl mt-5 hover:bg-[rgb(30,30,30)] active:bg-[#222]" onclick="document.location='friends.html'"> 
           <svg class="m-auto mr-0 w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M9 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-2 9a4 4 0 0 0-4 4v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1a4 4 0 0 0-4-4H7Zm8-1a1 1 0 0 1 1-1h1v-1a1 1 0 1 1 2 0v1h1a1 1 0 1 1 0 2h-1v1a1 1 0 1 1-2 0v-1h-1a1 1 0 0 1-1-1Z" clip-rule="evenodd"/>
            </svg>
            <p class="m-auto ml-0">Friends</p>
        </button>
        
        <button class="w-full mt-8 px-3 py-2 rounded-2xl flex items-center border border-white hover:bg-white hover:text-black active:bg-[#111] active:text-white" onclick="document.location='profile.html'">
            <div class="bg-white w-10 rounded-2xl">
                <img src="img/profile.png" alt="profile" class="w-10">
            </div>
            
            <p class="ml-3">John Ko Ko</p>
        </button>

        <button class="bg-white text-black w-45.5 p-2 rounded-2xl fixed bottom-0 mb-3 hover:bg-[#cccbcb] active:bg-white" onclick="document.location='login-page.html'">Logout</button>

    </aside>

    <main>
        <div class="bg-[#750cff] w-90 md:w-110 px-2 py-5 mt-13 m-auto rounded-[20px]">
            <div class="bg-white px-2 py-3 rounded-[15px] mb-5">
                <h3 class="text-[19px] font-medium">Discussion Forum</h3>
                <p>5 Participants</p>
            </div>

            <!-- message from person 1 -->
            <div class="flex items-center mb-5">
                <svg class="w-13 h-13 text-white mr-3 hover:text-gray-300 active:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M12 20a7.966 7.966 0 0 1-5.002-1.756l.002.001v-.683c0-1.794 1.492-3.25 3.333-3.25h3.334c1.84 0 3.333 1.456 3.333 3.25v.683A7.966 7.966 0 0 1 12 20ZM2 12C2 6.477 6.477 2 12 2s10 4.477 10 10c0 5.5-4.44 9.963-9.932 10h-.138C6.438 21.962 2 17.5 2 12Zm10-5c-1.84 0-3.333 1.455-3.333 3.25S10.159 13.5 12 13.5c1.84 0 3.333-1.455 3.333-3.25S13.841 7 12 7Z" clip-rule="evenodd"/>
                </svg>
                <!-- person name and message -->
                <div>
                    <p class="text-white mb-2"><b>Kyaw Kyaw Htut</b></p>
                    <p class="text-black bg-white px-4 py-2 rounded-4xl">What skills should we have <br> as a developer?</p>
                </div>
            </div>

            <!-- message from person 2 -->
            <div class="flex items-center mb-5">
                <svg class="w-13 h-13 text-white mr-3 hover:text-gray-300 active:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M12 20a7.966 7.966 0 0 1-5.002-1.756l.002.001v-.683c0-1.794 1.492-3.25 3.333-3.25h3.334c1.84 0 3.333 1.456 3.333 3.25v.683A7.966 7.966 0 0 1 12 20ZM2 12C2 6.477 6.477 2 12 2s10 4.477 10 10c0 5.5-4.44 9.963-9.932 10h-.138C6.438 21.962 2 17.5 2 12Zm10-5c-1.84 0-3.333 1.455-3.333 3.25S10.159 13.5 12 13.5c1.84 0 3.333-1.455 3.333-3.25S13.841 7 12 7Z" clip-rule="evenodd"/>
                </svg>
                <!-- person name and message -->
                <div>
                    <p class="text-white mb-2"><b>La Pyae</b></p>
                    <p class="text-black bg-white px-4 py-2 rounded-3xl">Consistency bro</p>
                </div>
            </div>

            <!-- message from person 3 -->
            <div class="flex items-center mb-5">
                <svg class="w-13 h-13 text-white mr-3 hover:text-gray-300 active:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M12 20a7.966 7.966 0 0 1-5.002-1.756l.002.001v-.683c0-1.794 1.492-3.25 3.333-3.25h3.334c1.84 0 3.333 1.456 3.333 3.25v.683A7.966 7.966 0 0 1 12 20ZM2 12C2 6.477 6.477 2 12 2s10 4.477 10 10c0 5.5-4.44 9.963-9.932 10h-.138C6.438 21.962 2 17.5 2 12Zm10-5c-1.84 0-3.333 1.455-3.333 3.25S10.159 13.5 12 13.5c1.84 0 3.333-1.455 3.333-3.25S13.841 7 12 7Z" clip-rule="evenodd"/>
                </svg>
                <!-- person name and message -->
                <div>
                    <p class="text-white mb-2"><b>John Wick</b></p>
                    <p class="text-black bg-white px-4 py-2 rounded-3xl">To build a software company, <br>what advice do you want to give?</p>
                </div>
            </div>


            <!-- message from person 4 -->
            <div class="flex items-center mb-5">
                <svg class="w-13 h-13 text-white mr-3 hover:text-gray-300 active:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M12 20a7.966 7.966 0 0 1-5.002-1.756l.002.001v-.683c0-1.794 1.492-3.25 3.333-3.25h3.334c1.84 0 3.333 1.456 3.333 3.25v.683A7.966 7.966 0 0 1 12 20ZM2 12C2 6.477 6.477 2 12 2s10 4.477 10 10c0 5.5-4.44 9.963-9.932 10h-.138C6.438 21.962 2 17.5 2 12Zm10-5c-1.84 0-3.333 1.455-3.333 3.25S10.159 13.5 12 13.5c1.84 0 3.333-1.455 3.333-3.25S13.841 7 12 7Z" clip-rule="evenodd"/>
                </svg>
                <!-- person name and message -->
                <div>
                    <p class="text-white mb-2"><b>Bill Gates</b></p>
                    <p class="text-black bg-white px-4 py-2 rounded-3xl">
                        Solve a genuinely painful problem
                    </p>
                </div>
            </div>

            <!-- message 1 from me -->
             <div class="flex items-center mb-5">
                <p class="text-black bg-white px-4 py-2 rounded-3xl text-center ml-auto"> Hi guys</p>
             </div>

             <!-- message 2 from me -->
             <div class="flex items-center">
                <p class="text-black bg-white px-4 py-2 rounded-3xl text-center ml-auto"> Welcome to Talknote</p>
             </div>
        </div>

        <!-- send message box -->
        <div class="bg-[#750cff] w-90 md:w-110 px-2 py-5 mt-5 m-auto rounded-[20px] flex items-center mb-5">
            <div class="flex items-center m-auto gap-3">
                <svg class="w-9 h-9 text-gray-800 dark:text-white hover:text-gray-300 active:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2ZM7.99 9a1 1 0 0 1 1-1H9a1 1 0 0 1 0 2h-.01a1 1 0 0 1-1-1ZM14 9a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H15a1 1 0 0 1-1-1Zm-5.506 7.216A5.5 5.5 0 0 1 6.6 13h10.81a5.5 5.5 0 0 1-8.916 3.216Z" clip-rule="evenodd"/>
                </svg>

                <input type="text" class="bg-white py-2 px-3 text-gray-400 rounded-3xl" value="write message">
                <button class="bg-white px-4 py-2 rounded-2xl hover:bg-gray-300 active:bg-white">Send</button>
            </div>
        </div>


    </main>


    <script>
        //side bar
        let show = false;
        function sidebar(){
            let sideBar = document.getElementById('sidebar');

            if(show === false){
                sideBar.style.left = '0';
                show = true;
            }

            else{
                sideBar.style.left = '-100%';
                show = false;
            }
        }
        
    </script>


</body>
</html>
